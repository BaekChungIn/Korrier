<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Korrier - Korea in your Carrier</title>
  <meta name="theme-color" content="#F5F2EC">
  <meta name="description" content="Korrier - 실시간 한국 트렌드와 여행 일정">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Korrier">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans Thai", sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; letter-spacing: -0.022em; }
    body { background:#F5F5F7; margin:0; display:flex; justify-content:center; align-items:center; min-height:100vh; color:#1D1D1F; -webkit-font-smoothing:antialiased; }
    .app-screen { width:100%; max-width:440px; height:100vh; height:100dvh; max-height:940px; background:#fff; position:relative; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 32px 80px -20px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.04); }
    @media (min-width:640px){ .app-screen{ border-radius:48px; height:94vh; border:10px solid #1D1D1F; } }
    .no-scrollbar::-webkit-scrollbar{ display:none; } .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
    .timeline-line{ position:absolute; left:11px; top:28px; bottom:-16px; width:0; border-left:2px dashed #CBD5E1; z-index:0; }
    .leaflet-container{ font-family:inherit; background:#F1F5F9; }
    .line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .snap-x-mandatory{ scroll-snap-type:x mandatory; }
    .snap-center{ scroll-snap-align:center; }
    .skeleton{ background:linear-gradient(90deg,#EEF0F3 25%,#F6F7F9 37%,#EEF0F3 63%); background-size:400% 100%; animation:sk 1.3s ease infinite; }
    @keyframes sk{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }
    .sheet-enter{ animation:sheetUp .28s cubic-bezier(.2,.8,.2,1); }
    @keyframes sheetUp{ from{ transform:translateY(40px); opacity:.4 } to{ transform:none; opacity:1 } }
    .modal{ display:none; }
    .tab-item{ width:20%; }
    .set-row{ width:100%; display:flex; align-items:center; gap:14px; padding:18px 20px; font-size:16px; font-weight:600; color:inherit; }
    .set-val{ font-size:14px; font-weight:400; color:#8E8E93; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @keyframes fanPop{ 0%{ transform:scale(.2); opacity:0 } 60%{ transform:scale(1.12); opacity:1 } 80%{ transform:scale(.96) } 100%{ transform:scale(1) } }
    @keyframes fanRing{ 0%{ transform:scale(.8); opacity:.7 } 100%{ transform:scale(1.9); opacity:0 } }
    @keyframes fadeUp{ from{ transform:translateY(14px); opacity:0 } to{ transform:none; opacity:1 } }
    .fan-pop{ animation:fanPop .7s cubic-bezier(.2,.9,.3,1.2) both; }
    .fan-ring{ animation:fanRing 1.4s ease-out .35s 2 both; }
    .fade-up{ animation:fadeUp .5s ease-out both; }
    @keyframes fanBit{ 0%{ transform:translate(0,0) scale(.3); opacity:0 } 15%{ opacity:1 } 100%{ transform:translate(var(--x),var(--y)) scale(1); opacity:0 } }
    .fan-bit{ position:absolute; width:9px; height:9px; border-radius:50%; animation:fanBit 1.1s cubic-bezier(.15,.8,.3,1) both; }
    .line-clamp-1{ display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
    .wordmark{ background:linear-gradient(90deg,#1B2A6B,#5B2D82); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .safe-top{ padding-top:calc(env(safe-area-inset-top) + 1rem); }
    #tabBar{ height:calc(72px + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); }
    @media (display-mode: standalone){ .app-screen{ max-width:none; max-height:none; border:0 !important; border-radius:0 !important; height:100dvh; } }
    .modal.open{ display:flex; }
  </style>
</head>
<body>
<main class="app-screen" id="app">

  <!-- 스플래시 -->
  <div id="splashScreen" class="absolute inset-0 bg-[#F5F2EC] z-[150] flex flex-col items-center justify-center px-8 transition-opacity duration-300 select-none">
    <img src="./logo.svg" alt="Korrier" class="w-[190px] h-[190px] -mb-2">
    <h1 class="wordmark text-[46px] font-black tracking-tight mb-1">Korrier</h1>
    <p class="text-[13px] text-[#8E8E93] mb-6">Korea in your Carrier</p>
    <div class="flex items-center gap-2 text-[#8E8E93] text-[13px] font-light">
      <div class="w-4 h-4 border-2 border-[#1E3A8A] border-t-transparent rounded-full animate-spin"></div>
      <span data-i18n="splashLoading"></span>
    </div>
  </div>

  <!-- 헤더 -->
  <header class="safe-top px-4 pb-2.5 bg-white/95 backdrop-blur-xl border-b border-black/[0.04] shrink-0 z-30">
    <div class="flex items-center justify-between gap-2">
      <button id="btnHome" class="flex items-center gap-1.5 select-none min-w-0">
        <img src="./logo.svg" alt="" class="w-11 h-11 -ml-1.5 -my-1 shrink-0">
        <h2 class="wordmark text-[22px] font-extrabold tracking-tight leading-none">Korrier</h2>
      </button>
      <div class="flex items-center gap-0.5 shrink-0">
        <button id="starPill" class="hidden items-center gap-1 pl-0.5 pr-2 py-0.5 mr-1 rounded-full bg-[#FFF0F6] text-[#E11D74] text-[11px] font-bold active:scale-95 transition">
          <span id="starPillImg" class="w-6 h-6 rounded-full overflow-hidden bg-white flex items-center justify-center"></span><span id="starPillText"></span>
        </button>
        <div class="relative">
          <button id="btnLang" class="w-10 h-10 rounded-full flex items-center justify-center text-[#1D1D1F] hover:bg-black/[0.04] active:scale-95 transition gap-0.5" aria-label="language"><span data-icon="globe" data-icon-cls="w-[22px] h-[22px]"></span><span id="currentLangText" class="hidden"></span></button>
          <div id="langMenu" class="hidden absolute top-full mt-1.5 right-0 w-52 bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl border border-black/[0.06] py-1.5 z-50 text-[14px]"></div>
        </div>
        <button id="btnFriends" class="w-10 h-10 rounded-full flex items-center justify-center text-[#1D1D1F] hover:bg-black/[0.04] active:scale-95 transition" aria-label="friends" data-icon="users" data-icon-cls="w-[22px] h-[22px]"></button>
        <button id="btnSettings" class="w-10 h-10 rounded-full flex items-center justify-center text-[#1D1D1F] hover:bg-black/[0.04] active:scale-95 transition" aria-label="settings" data-icon="gear" data-icon-cls="w-[22px] h-[22px]"></button>
      </div>
    </div>
  </header>

  <!-- 본문 -->
  <section id="contentContainer" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 pb-28 no-scrollbar bg-[#F5F5F7]">
    <div id="catCard" class="bg-white rounded-[24px] px-5 py-4 border border-black/[0.03] shadow-[0_2px_14px_rgba(0,0,0,0.03)]">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 id="categoryTitle" class="text-[26px] font-bold tracking-tight leading-tight"></h3>
          <p id="liveClock" class="text-[12px] text-[#8E8E93] font-medium tracking-wider mt-0.5"></p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0 mt-1">
          <div id="liveBadge" class="flex items-center gap-1.5 bg-[#E8F5E9] border border-[#C8E6C9] px-3 py-1 rounded-full">
            <span class="w-2 h-2 rounded-full bg-[#34C759] animate-pulse"></span>
            <span class="text-[12px] text-[#2E7D32]" data-i18n="liveSearch"></span>
          </div>
          <button id="btnRefresh" class="w-8 h-8 rounded-full bg-[#F2F2F7] hover:bg-[#E5E5EA] flex items-center justify-center active:scale-95 transition" aria-label="refresh">
            <span id="refreshIcon" data-icon="refresh" data-icon-cls="w-4 h-4"></span>
          </button>
        </div>
      </div>
      <div id="metaLine" class="hidden mt-2 text-[11px] text-[#8E8E93] leading-relaxed"></div>
    </div>

    <div id="installBanner" class="hidden bg-white rounded-[22px] p-4 border border-black/[0.04] flex items-center gap-3">
      <img src="./icon-192.png" alt="" class="w-11 h-11 rounded-xl">
      <div class="flex-1 min-w-0"><p class="text-[13px] font-semibold" data-i18n="installTitle"></p><p id="installDesc" class="text-[11px] text-[#8E8E93] leading-snug"></p></div>
      <button id="btnInstall" class="px-3 py-1.5 rounded-full bg-[#0071E3] text-white text-[12px] font-medium" data-i18n="install"></button>
      <button id="btnInstallClose" class="w-7 h-7 rounded-full text-[#8E8E93] flex items-center justify-center" data-icon="close" data-icon-cls="w-4 h-4"></button>
    </div>

    <!-- 지도 / 여행 일정 -->
    <div id="mapView" class="hidden space-y-4">
      <div id="sharedBanner" class="hidden bg-blue-50 border border-blue-100 rounded-2xl p-3 flex items-center justify-between gap-2 text-[12px] text-blue-900"></div>

      <div id="tripEmpty" class="bg-white rounded-[32px] p-6 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.03]">
        <h4 class="text-[22px] font-bold tracking-tight leading-tight"><span data-i18n="whereTo"></span><br><span class="text-[#0071E3]" data-i18n="makeTrip"></span></h4>
        <p class="text-[12px] text-[#8E8E93] font-light mt-1.5" data-i18n="tripIntro"></p>
        <div id="quickRegions" class="flex flex-wrap gap-2 my-5"></div>
        <div id="savedTripsBox" class="hidden mb-5">
          <p class="text-[12px] font-semibold text-[#8E8E93] mb-2" data-i18n="myTrips"></p>
          <div id="savedTripsList" class="space-y-2"></div>
        </div>
        <div id="noTripBox" class="py-8 border-t border-b border-black/[0.04] text-center mb-5">
          <div class="w-14 h-14 rounded-full bg-[#F2F2F7] mx-auto flex items-center justify-center text-[#0071E3] mb-2.5" data-icon="map" data-icon-cls="w-7 h-7"></div>
          <p class="text-[14px] font-semibold mb-1" data-i18n="noTrip"></p>
          <p class="text-[12px] text-[#8E8E93] font-light" data-i18n="noTripSub"></p>
        </div>
        <button id="btnNewTrip" class="w-full py-3.5 rounded-2xl bg-[#0071E3] hover:bg-[#0077ED] text-white font-medium text-[14px] flex items-center justify-center gap-2 active:scale-95 transition">
          <span data-icon="plus" data-icon-cls="w-4 h-4"></span><span data-i18n="newTrip"></span>
        </button>
      </div>

      <div id="tripActive" class="hidden bg-white rounded-[32px] p-5 shadow-[0_2px_16px_rgba(0,0,0,0.03)] border border-black/[0.03]">
        <div class="flex items-center justify-between mb-3">
          <button id="btnCloseTrip" class="w-8 h-8 rounded-full bg-[#F2F2F7] flex items-center justify-center hover:bg-[#E5E5EA]" data-icon="close" data-icon-cls="w-4 h-4"></button>
          <div class="flex items-center gap-2 min-w-0">
            <span id="tripBadgeRegion" class="px-2.5 py-0.5 rounded-full bg-blue-50 text-[#0071E3] text-[11px] font-medium truncate max-w-[130px]"></span>
            <span id="tripBadgeDate" class="text-[12px] text-[#8E8E93] truncate"></span>
          </div>
          <button id="btnShareTrip" class="w-8 h-8 rounded-full bg-[#F2F2F7] flex items-center justify-center hover:bg-[#E5E5EA]" data-icon="share" data-icon-cls="w-4 h-4"></button>
        </div>
        <div class="text-center mb-4">
          <h4 id="tripHeading" class="text-[21px] font-bold tracking-tight leading-snug"></h4>
          <p class="text-[12px] text-[#8E8E93] font-light mt-1" data-i18n="tripSub"></p>
        </div>
        <div class="relative isolate w-full h-[240px] rounded-[22px] border border-black/[0.06] overflow-hidden mb-4 bg-[#F1F5F9]">
          <div id="tripMap" class="w-full h-full"></div>
          <button id="btnCenterMap" class="absolute bottom-3 right-3 w-9 h-9 rounded-full bg-white text-[#0071E3] shadow-md border border-black/[0.08] flex items-center justify-center z-[400] active:scale-90 transition" data-icon="crosshair" data-icon-cls="w-4 h-4"></button>
        </div>
        <div id="layerChips" class="flex items-center gap-1.5 mb-3 overflow-x-auto no-scrollbar"></div>
        <div id="poiCard" class="hidden mb-4"></div>
        <div id="dayPills" class="flex items-center gap-2 mb-4 overflow-x-auto no-scrollbar"></div>
        <button id="btnAddPlace" class="w-full mb-4 py-3 px-4 rounded-2xl bg-[#0071E3] hover:bg-[#0077ED] text-white text-[13px] font-medium flex items-center justify-center gap-2 active:scale-95 transition">
          <span data-icon="search" data-icon-cls="w-4 h-4"></span><span data-i18n="addPlace"></span>
        </button>
        <div id="timeline" class="space-y-3 relative"></div>
        <div id="tripActions" class="mt-6 pt-4 border-t border-black/[0.04] grid grid-cols-2 gap-2">
          <button id="btnChangeTrip" class="py-3 rounded-2xl bg-[#F2F2F7] hover:bg-[#E5E5EA] text-[12px] font-medium" data-i18n="changeTrip"></button>
          <button id="btnSaveTrip" class="py-3 rounded-2xl bg-[#1D1D1F] text-white text-[12px] font-medium flex items-center justify-center gap-1.5"><span data-icon="bookmark" data-icon-cls="w-3.5 h-3.5"></span><span data-i18n="saveTrip"></span></button>
        </div>
      </div>
    </div>

    <!-- 패션 서브탭 -->
    <div id="fashionSubTabs" class="hidden space-y-2">
      <div class="grid grid-cols-2 p-1 bg-[#E5E5EA]/70 rounded-2xl gap-1 text-[13px] border border-black/[0.04]">
        <button id="subTabArtist" class="py-2 rounded-xl flex items-center justify-center gap-1.5 transition"><span data-icon="star" data-icon-cls="w-3.5 h-3.5"></span><span data-i18n="artistTab"></span></button>
        <button id="subTabKFashion" class="py-2 rounded-xl flex items-center justify-center gap-1.5 transition"><span data-icon="trend" data-icon-cls="w-3.5 h-3.5"></span><span data-i18n="kfashionTab"></span></button>
      </div>
      <div id="platformArea" class="hidden flex items-center bg-white p-1 rounded-2xl border border-black/[0.06]">
        <button id="platMusinsa" class="flex-1 py-1.5 rounded-xl text-[12px] transition" data-i18n="musinsa"></button>
        <button id="platAbly" class="flex-1 py-1.5 rounded-xl text-[12px] transition" data-i18n="ably"></button>
      </div>
    </div>

    <!-- 콘서트 서브탭 -->
    <div id="concertSubTabs" class="hidden grid grid-cols-2 p-1 bg-[#E5E5EA]/70 rounded-2xl gap-1 text-[13px] border border-black/[0.04]">
      <button id="subTabKpop" class="py-2 rounded-xl flex items-center justify-center gap-1.5 transition"><span data-icon="mic" data-icon-cls="w-3.5 h-3.5"></span><span data-i18n="concertKpop"></span></button>
      <button id="subTabGlobal" class="py-2 rounded-xl flex items-center justify-center gap-1.5 transition"><span data-icon="globe" data-icon-cls="w-3.5 h-3.5"></span><span data-i18n="concertGlobal"></span></button>
    </div>

    <!-- 리스트 -->
    <div id="listArea" class="space-y-4"></div>
    <div id="starView" class="hidden space-y-4"></div>
    <div id="communityView" class="hidden space-y-3"></div>
  </section>

  <button id="btnWrite" class="hidden absolute right-5 z-[35] w-14 h-14 rounded-full bg-[#1E3A8A] text-white shadow-[0_10px_24px_rgba(30,58,138,0.35)] items-center justify-center active:scale-95 transition" style="bottom:calc(88px + env(safe-area-inset-bottom))" data-icon="pencil" data-icon-cls="w-6 h-6"></button>

  <!-- 하단 탭바 -->
  <nav id="tabBar" class="absolute bottom-0 left-0 right-0 h-[72px] bg-white/90 backdrop-blur-2xl border-t border-black/[0.05] flex items-stretch justify-around px-1 z-30"></nav>

  <!-- 상세 시트 -->
  <!-- 핫플 전체 지도 -->
  <div id="hotMapOverlay" class="hidden absolute inset-0 z-[120] bg-[#F5F5F7] flex-col">
    <div class="safe-top px-4 pb-3 bg-white flex items-center gap-3 shrink-0">
      <button id="btnHotMapClose" class="w-9 h-9 rounded-full bg-[#F2F2F7] flex items-center justify-center shrink-0" data-icon="chevL" data-icon-cls="w-5 h-5"></button>
      <div class="flex-1 min-w-0">
        <h3 class="text-[19px] font-bold tracking-tight" data-i18n="hotMapTitle"></h3>
        <p id="hotMapSub" class="text-[11px] text-[#8E8E93]"></p>
      </div>
    </div>
    <div id="hotMapFilters" class="px-4 pb-3 bg-white flex gap-1.5 overflow-x-auto no-scrollbar shrink-0 border-b border-black/[0.05]"></div>
    <div class="relative flex-1 isolate">
      <div id="hotMap" class="absolute inset-0 bg-[#F1F5F9]"></div>
      <div id="hotMapCards" class="absolute left-0 right-0 bottom-0 z-[600] flex gap-3 overflow-x-auto snap-x-mandatory no-scrollbar px-[9%] pt-2" style="padding-bottom:calc(14px + env(safe-area-inset-bottom))"></div>
    </div>
  </div>

  <div id="sheetBackdrop" class="hidden absolute inset-0 bg-black/45 backdrop-blur-sm z-[135]"></div>
  <div id="detailSheet" class="hidden absolute bottom-0 left-0 right-0 z-[140] bg-white rounded-t-[36px] px-6 pt-3 pb-8 shadow-[0_-20px_50px_rgba(0,0,0,0.18)] flex-col max-h-[90%] overflow-hidden border-t border-black/[0.06]">
    <div id="sheetHandle" class="w-12 h-1.5 bg-[#D1D1D6] rounded-full mx-auto mb-4 shrink-0 cursor-pointer"></div>
    <div id="detailBody" class="overflow-y-auto no-scrollbar space-y-4 pb-3"></div>
  </div>

  <!-- 로그인/회원가입 (전체 화면) -->
  <div id="authScreen" class="hidden absolute inset-0 z-[180] bg-[#F7F8F9] flex-col">
    <div id="authLanding" class="flex-1 flex flex-col px-6" style="padding-bottom:calc(24px + env(safe-area-inset-bottom))">
      <div class="flex-1 flex flex-col items-center justify-center text-center">
        <img src="./logo.svg" alt="" class="w-[150px] h-[150px]">
        <p class="text-[15px] text-[#6E6E73] mt-2" data-i18n="landingSub"></p>
        <h1 class="wordmark text-[46px] font-black tracking-tight leading-tight">Korrier</h1>
      </div>
      <button id="btnGoogle" class="w-full py-4 rounded-[20px] bg-white border border-black/[0.08] text-[16px] font-bold flex items-center justify-center gap-3 active:scale-[0.98] transition">
        <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        <span data-i18n="continueGoogle"></span>
      </button>
      <button data-auth-go="login" class="w-full py-4 text-[15px] font-semibold text-[#4B5563]" data-i18n="continueEmail"></button>
      <button id="btnBrowse" class="w-full pb-2 text-[12px] text-[#8E8E93]" data-i18n="browseOnly"></button>
    </div>
    <div id="authForms" class="hidden flex-1 flex-col overflow-y-auto no-scrollbar px-6 safe-top">
      <button id="authBack" class="w-10 h-10 -ml-2 flex items-center justify-center" data-icon="chevL" data-icon-cls="w-6 h-6"></button>
      <h1 id="authTitle" class="text-[34px] font-black tracking-tight mt-5"></h1>
      <p id="authSubText" class="text-[14px] text-[#8E8E93] mt-1.5 mb-7"></p>
      <form id="authForm" class="space-y-3" novalidate>
        <input id="authNickname" type="text" maxlength="20" class="hidden w-full px-5 py-4 rounded-[18px] bg-[#EEF0F3] text-[16px] outline-none border-2 border-transparent focus:border-[#1E3A8A] focus:bg-white" data-i18n-ph="nickname">
        <input id="authEmail" type="email" autocomplete="email" class="w-full px-5 py-4 rounded-[18px] bg-[#EEF0F3] text-[16px] outline-none border-2 border-transparent focus:border-[#1E3A8A] focus:bg-white" data-i18n-ph="emailPh">
